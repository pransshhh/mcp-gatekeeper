[project]
name = "mcp-gatekeeper"
version = "0.1.0"
description = "Ask before any MCP tool call runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mcp-gatekeeper = "mcp_gatekeeper:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]