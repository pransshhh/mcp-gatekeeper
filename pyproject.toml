[project]
name = "mcp-gatekeeper"
version = "0.1.0"
description = "Ask before any MCP tool call runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
faulthandler_timeout = 30
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
# Fires on write(), flush(), cancel(), add_argument() and friends -- calls whose
# return value nobody wants. Not worth an `_ =` on every line.
reportUnusedCallResult = false

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportAny = false
reportExplicitAny = false
reportMissingParameterType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
